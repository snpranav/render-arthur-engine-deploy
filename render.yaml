# render.yaml
databases:
  - name: arthur-genai-db
    databaseName: arthur_genai_engine
    plan: free  # 1GB storage, deleted after 30 days

services:
  - type: web
    name: arthur-genai-engine
    runtime: image
    image:
      url: docker.io/arthurplatform/genai-engine-cpu:latest  # pin a release tag
    plan: free  # 512MB RAM, 0.1 CPU, sleeps after 15min idle
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3030
      - key: POSTGRES_URL
        fromDatabase: { name: arthur-genai-db, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: arthur-genai-db, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: arthur-genai-db, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: arthur-genai-db, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: arthur-genai-db, property: database }
      - key: POSTGRES_USE_SSL
        value: "true"
      - key: ALLOW_ADMIN_KEY_GENERAL_ACCESS
        value: enabled
      - key: GENAI_ENGINE_INGRESS_URI
        fromService:
          type: web
          name: arthur-genai-engine
          property: host
      - key: GENAI_ENGINE_ADMIN_KEY
        generateValue: true
      - key: GENAI_ENGINE_SECRET_STORE_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false  # set manually in Render dashboard
